<!DOCTYPE html>
<html>
<head><title>itch.io malformed</title></head>
<body>
  <!-- Missing inner title and author -->
  <div class="game_cell" data-game_id="99901">
    <div class="game_thumb">
      <!-- missing img src -->
    </div>
    <div class="game_cell_data">
      <!-- No title anchor -->
      <div class="game_title"></div>
    </div>
  </div>

  <!-- Valid cell mixed with corrupt cell -->
  <div class="game_cell" data-game_id="99902">
    <div class="game_thumb">
      <img src="https://img.itch.zone/test_broken/200x200.png" />
    </div>
    <div class="game_cell_data">
      <div class="game_title">
        <a class="title" href="https://itch.io/games/corrupt-test">Partially Valid Game</a>
      </div>
      <div class="game_author">
        <a href="https://itch.io/profile/corruptdev">Corrupt Dev</a>
      </div>
      <div class="game_text">A game that survived partial markup.</div>
      <div class="game_genre">Simulation</div>
    </div>
  </div>

  <!-- Completely unexpected structure inside cell -->
  <div class="game_cell">
    <p>Unknown redesign payload that has no attributes or expected classes</p>
  </div>
</body>
</html>
