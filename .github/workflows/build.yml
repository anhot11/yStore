name: Build and Release yStore APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a6383ddd4ea2132e4e0ba7f4f910733bc\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Vanilla Release and Debug APKs
        run: |
          ./gradlew assembleVanillaRelease assembleVanillaDebug --stacktrace

      - name: Prepare APK Files for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/vanilla/release/*-release.apk release-artifacts/yStore-v4.8.4-release.apk 2>/dev/null || cp app/build/outputs/apk/vanilla/release/*.apk release-artifacts/yStore-v4.8.4-release.apk
          cp app/build/outputs/apk/vanilla/debug/*-debug.apk release-artifacts/yStore-v4.8.4-debug.apk 2>/dev/null || cp app/build/outputs/apk/vanilla/debug/*.apk release-artifacts/yStore-v4.8.4-debug.apk
          ls -la release-artifacts/

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yStore-Release-APK
          path: release-artifacts/yStore-v4.8.4-release.apk
          if-no-files-found: error

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yStore-Debug-APK
          path: release-artifacts/yStore-v4.8.4-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.4
          name: "yStore v4.8.4 - Catálogo F-Droid + itch.io"
          body: |
            ### 🎮 yStore v4.8.4 - Edición Catálogo de Juegos

            • **Nombre de la App:** yStore
            • **App ID:** `y.Store`
            • **Novedades en esta versión:**
              - 🌟 **Catálogo Unificado**: Acceso a juegos agregados de F-Droid e itch.io.
              - 🔥 **Sección Hot**: Selección de juegos populares con verificación estricta de APKs Android.
              - 📥 **Descarga Directa de APKs**: Botón para descargar e instalar APKs directamente.
              - 👥 **Juegos Comunitarios**: Soporte para juegos publicados mediante GitHub y escaneados con VirusTotal.
              - ⚡ **Entrada Rápida**: Botón para ingresar directamente a los juegos sin requerir cuenta Google Play.
              - ⚙️ **Configuración de Servidor**: Posibilidad de conectar a tu propio backend FastAPI.
          files: |
            release-artifacts/yStore-v4.8.4-release.apk
            release-artifacts/yStore-v4.8.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
